  <text x="300" y="132" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-2">Kurarium</text>
  <text x="304" y="174" fill="#7dd3fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4.2">LOCAL &amp; SMB MEDIA VIEWER</text>
  <text x="304" y="212" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="1.1">IMAGES  /  VIDEO  /  PDF  /  MUSIC</text>
