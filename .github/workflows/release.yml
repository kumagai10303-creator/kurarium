name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: vendor/cache
          key: ffmpeg-n9.0.2-28-g669f5ab083-win64-gpl

      - name: Fetch FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Add FFmpeg to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$PWD/vendor/ffmpeg"

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Generate icons
        run: npm run icons

      - name: Package installer
        run: npm run package:installer

      - name: Package portable
        run: npm run package:portable

      - name: Prepare FFmpeg corresponding source
        shell: pwsh
        run: ./scripts/fetch-ffmpeg-source.ps1

      - name: Verify tag version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Generate legal notices
        shell: pwsh
        run: |
          $legalDir = "release/legal"
          if (Test-Path -LiteralPath $legalDir) { Remove-Item -LiteralPath $legalDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $legalDir | Out-Null
          Copy-Item vendor/licenses/FFMPEG-GPLv3.txt "$legalDir/FFMPEG-GPLv3.txt"
          Copy-Item vendor/licenses/FFMPEG-SOURCE.txt "$legalDir/FFMPEG-SOURCE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "$legalDir/THIRD_PARTY_NOTICES.md"
          Copy-Item LICENSE "$legalDir/LICENSE.txt"
          Compress-Archive -Path "$legalDir/*" -DestinationPath release/LEGAL-NOTICES.zip -Force
          Remove-Item -LiteralPath $legalDir -Recurse -Force

      - name: Generate SBOM
        shell: pwsh
        run: |
          npm sbom --sbom-format=cyclonedx --sbom-type=application --omit=dev |
            Set-Content -LiteralPath release/SBOM.cdx.json -Encoding utf8

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $files = @(
            "release/Kurarium-Installer-$version-win-x64.exe",
            "release/Kurarium-Portable-$version-win-x64.zip",
            "release/LEGAL-NOTICES.zip",
            "release/FFMPEG-SOURCE.zip",
            "release/SBOM.cdx.json"
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release asset: $file" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
          Get-AuthenticodeSignature "release/Kurarium-Installer-$version-win-x64.exe" | Format-List

      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/Kurarium-Installer-*-win-x64.exe
            release/Kurarium-Portable-*-win-x64.zip

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $notesFile = "docs/RELEASE_NOTES_$version.md"
          $exists = gh release view $tag 2>$null
          if (-not $exists) {
            if (Test-Path -LiteralPath $notesFile) {
              gh release create $tag --draft --title "Kurarium $version" --notes-file $notesFile
            } else {
              gh release create $tag --draft --title "Kurarium $version" --generate-notes
            }
          } elseif (Test-Path -LiteralPath $notesFile) {
            gh release edit $tag --notes-file $notesFile
          }
          gh release upload $tag `
            "release/Kurarium-Installer-$version-win-x64.exe" `
            "release/Kurarium-Portable-$version-win-x64.zip" `
            "release/SHA256SUMS.txt" `
            "release/LEGAL-NOTICES.zip" `
            "release/FFMPEG-SOURCE.zip" `
            "release/SBOM.cdx.json" `
            --clobber
